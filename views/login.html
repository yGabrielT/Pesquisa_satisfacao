<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PesquisaRPG - Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="center">

        <div class="menu-login point-filter">
            <h1 id="titulo-login">Login</h1>
            <img id= "login-logo" class="point-filter" src="/img/enemies/slime.png">
            <form class="loginForm">
                <h4 class="align-text">
                    Entrar Questionário
                </h4>
                <input type="password" placeholder="Senha da sala" required>
                <button type="submit" class="attack-btn point-filter" onclick="location.href='/Quest?id=10'">Entrar</button>
            </form>
            <form class="loginForm">
                <h4 class="align-text">
                    Criar Questionário
                </h4>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Senha" required>
                <button type="submit" class="attack-btn point-filter">Entrar</button>
                <button type="button" class="attack-btn point-filter" onclick="location.href='/Registrar'">Registrar</button>
                
            </form>
        </div>
    </div>


</body>
</html>
