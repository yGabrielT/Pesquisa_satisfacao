<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PesquisaRPG - Criar Questionário</title>
    <link rel="stylesheet" href="../css/style.css">

</head>
<body>
    <div class="center">

        <div class="menu-login point-filter">
            <h1 id="titulo-login">Criar Questionário</h1>
            <h4 class="align-text">
                        Nome do Questionário
                    </h4>
            <input id ="nome-quest" placeholder="Nome" class="pergunta-div-dev" >
            <div class="pergunta-Container">

                <form id="loginForm1" class="loginForm">
                    <h4 class="align-text">
                        Pergunta 1
                    </h4>
                    <input id="pergunta" placeholder="Pergunta" class="pergunta-div-dev" >
                    <input id="Resposta1" placeholder="1º Resposta" class="attack-btn-dev" >
                    <input id="Resposta2" placeholder="2º Resposta" class="attack-btn-dev" >
                    <input id="Resposta3" placeholder="3º Resposta" class="attack-btn-dev" >
                    <input id="Resposta4" placeholder="4º Resposta" class="attack-btn-dev" >
                </form>
            </div>
                
            <button id="adicionar-btn" type="submit" class="attack-btn point-filter">Adicionar Pergunta</button>
            <button type="submit" class="attack-btn point-filter">Publicar Questionário</button>
        </div>
    </div>
    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/criarquest.js"></script>
</body>
</html>
