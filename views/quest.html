<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PesquisaRPG - Questionário</title>
    <link rel="stylesheet" href="../css/style.css">


</head>

<body>
    <div class="battle">
        <div class="pergunta-menu point-filter">
            <a class="pergunta-div point-filter">AAAAAAAAAAAAAAAAAAAAAAAAAAA</a>
        </div>
        <div class="attack-menu point-filter">
            <button id ="btn-0" class="attack-btn point-filter" type="button">AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA</button>
            <button id ="btn-1" class="attack-btn point-filter" type="button">Button</button>
            <button id ="btn-2" class="attack-btn point-filter" type="button">Button</button>
            <button id ="btn-3" class="attack-btn point-filter" type="button">Button</button>
        </div>
        <div class="enemy-position point-filter">
            <img id="enemy_img"class="enemy point-filter" src="">
            <img class="shadow point-filter" src="/img/enemies/shadow.png">
            <div class="attack" style="display: none;">
                <img class="attack_sprite" src="">
            </div>
        </div>
        <div class="perfil-position point-filter">
            <img class="perfil point-filter" src="/img/profile.png">
        </div>


        
    </div>
    <div id="victory-container" style="display: none;">
        <div id="victory-screen">
        <div class="victory-box">
                <h1>Vitória!</h1>
                <p>Você derrotou todos os monstros!</p>
                <button id="voltar-btn" type="button" class="criarQuest-btn point-filter" onclick="location.href='/'">Voltar para o menu inicial</button>
            </div>
        </div>
    </div>

    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/quest.js"></script>
</body>


</html>
